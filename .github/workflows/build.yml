name: Build Ride Rate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the offer maths
        run: |
          mkdir -p "$RUNNER_TEMP/check"
          javac -d "$RUNNER_TEMP/check" app/src/main/java/com/aniketkhera/riderate/OfferParser.java tools/ParserCheck.java
          java -cp "$RUNNER_TEMP/check" ParserCheck

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build the install file
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publish the download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk RideRate.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RideRate.apk \
            --target "${{ github.sha }}" \
            --title "Ride Rate (build ${{ github.run_number }})" \
            --notes "On your phone, tap RideRate.apk below to download it, then open it to install."
